<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NexShop — Microservices Store</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════════════ */
    :root {
      --bg:           #080c14;
      --surface:      #0d1526;
      --glass:        rgba(255,255,255,0.04);
      --border:       rgba(255,255,255,0.08);
      --accent:       #00e5a0;
      --accent-dark:  #00c47a;
      --accent2:      #0099ff;
      --warn:         #ff4d6d;
      --text:         #e8edf5;
      --muted:        #5a6882;
      --card-glow:    0 0 40px rgba(0,229,160,0.06);
      --font-display: 'Syne', sans-serif;
      --font-body:    'DM Sans', sans-serif;
      --radius:       14px;
      --radius-sm:    8px;
    }

    /* ═══════════════════════════════════════════════
       RESET
    ═══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 400;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grid texture */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Top glow */
    body::after {
      content: '';
      position: fixed;
      top: -200px; left: 50%; transform: translateX(-50%);
      width: 900px; height: 500px;
      background: radial-gradient(ellipse, rgba(0,153,255,0.12) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    app-root { position: relative; z-index: 1; display: block; }

    /* ═══════════════════════════════════════════════
       NAVBAR
    ═══════════════════════════════════════════════ */
    .nexshop-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,12,20,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      animation: slideDown 0.5s ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }

    .nav-brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-weight: 800; font-size: 14px; color: #080c14;
      flex-shrink: 0;
    }

    .nav-brand-name {
      font-family: var(--font-display);
      font-weight: 700; font-size: 1.1rem;
      color: var(--text); letter-spacing: -0.3px;
    }

    .nav-brand-accent { color: var(--accent); }

    .nav-right {
      display: flex; align-items: center; gap: 1rem;
    }

    .nav-hamburger {
      background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: var(--radius-sm);
      padding: 6px; cursor: pointer;
      display: none;
    }

    @media (max-width: 768px) {
      .nav-hamburger { display: flex; }
      .nav-menu { display: none; }
      .nav-menu.open { display: flex; flex-direction: column; position: absolute; top: 64px; right: 0; left: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; gap: 1rem; }
    }

    .nav-menu {
      display: flex; align-items: center; gap: 1rem;
    }

    .nav-user {
      display: flex; align-items: center; gap: 8px;
    }

    .nav-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; color: #080c14;
      flex-shrink: 0;
    }

    .nav-username {
      font-size: 0.85rem; font-weight: 500; color: var(--text);
    }

    /* ═══════════════════════════════════════════════
       BUTTONS
    ═══════════════════════════════════════════════ */
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #080c14; border: none; border-radius: var(--radius-sm);
      padding: 10px 22px; font-weight: 700; font-size: 0.88rem;
      cursor: pointer; font-family: var(--font-display);
      display: inline-flex; align-items: center; gap: 8px;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: -0.2px; white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.85; transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-primary.btn-full { width: 100%; justify-content: center; }

    .btn-ghost {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 8px 18px;
      border-radius: var(--radius-sm); font-size: 0.84rem;
      cursor: pointer; font-family: var(--font-body);
      transition: all 0.2s; white-space: nowrap;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .btn-order {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #080c14; border: none; border-radius: var(--radius-sm);
      padding: 0 18px; height: 40px;
      font-weight: 700; font-size: 0.82rem;
      cursor: pointer; font-family: var(--font-body);
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-order:hover { opacity: 0.85; transform: scale(0.98); }

    /* ═══════════════════════════════════════════════
       PAGE LAYOUT
    ═══════════════════════════════════════════════ */
    .nexshop-page {
      max-width: 1100px; margin: 0 auto;
      padding: 2.5rem 2rem 4rem;
    }

    .page-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.5s ease 0.1s both;
      gap: 1rem;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 2rem; font-weight: 800;
      letter-spacing: -1px; line-height: 1;
    }

    .page-title-count { color: var(--accent); }
    .page-title-accent { color: var(--accent); }

    .page-subtitle {
      font-size: 0.85rem; color: var(--muted);
      margin-top: 6px; font-weight: 300;
    }

    /* ═══════════════════════════════════════════════
       ALERTS
    ═══════════════════════════════════════════════ */
    .alert {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; border-radius: var(--radius-sm);
      font-size: 0.85rem; margin-bottom: 1.5rem;
      animation: fadeUp 0.3s ease;
    }

    .alert-success {
      background: rgba(0,229,160,0.08);
      border: 1px solid rgba(0,229,160,0.25);
      color: var(--accent);
    }

    .alert-error {
      background: rgba(255,77,109,0.08);
      border: 1px solid rgba(255,77,109,0.25);
      color: var(--warn);
    }

    .alert-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    /* ═══════════════════════════════════════════════
       PRODUCT GRID + CARDS
    ═══════════════════════════════════════════════ */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }

    .product-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1rem;
      position: relative; overflow: hidden;
      transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
      animation: fadeUp 0.5s ease both;
    }

    .product-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity: 0; transition: opacity 0.3s;
    }

    .product-card:hover {
      border-color: rgba(0,229,160,0.25);
      transform: translateY(-3px);
      box-shadow: var(--card-glow);
    }

    .product-card:hover::before { opacity: 1; }

    /* Stagger animation delays */
    .product-card:nth-child(1) { animation-delay: 0.05s; }
    .product-card:nth-child(2) { animation-delay: 0.10s; }
    .product-card:nth-child(3) { animation-delay: 0.15s; }
    .product-card:nth-child(4) { animation-delay: 0.20s; }
    .product-card:nth-child(5) { animation-delay: 0.25s; }
    .product-card:nth-child(6) { animation-delay: 0.30s; }

    .card-badge {
      display: inline-flex; align-items: center;
      background: rgba(0,153,255,0.1);
      border: 1px solid rgba(0,153,255,0.2);
      color: var(--accent2); border-radius: 4px;
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      padding: 3px 8px; width: fit-content;
    }

    .card-name {
      font-family: var(--font-display);
      font-size: 1.05rem; font-weight: 700;
      color: var(--text); line-height: 1.3;
    }

    .card-price {
      font-size: 1.4rem; font-weight: 700;
      color: var(--accent); font-family: var(--font-display);
    }

    .card-price sup {
      font-size: 0.7rem; vertical-align: super; margin-right: 1px;
    }

    .card-order-row {
      display: flex; align-items: center; gap: 10px;
      border-top: 1px solid var(--border); padding-top: 1rem;
    }

    .qty-input-wrap {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow: hidden;
      flex: 1;
    }

    .qty-label {
      padding: 0 10px; font-size: 0.72rem;
      color: var(--muted); letter-spacing: 0.4px;
      border-right: 1px solid var(--border);
      white-space: nowrap; height: 40px;
      display: flex; align-items: center;
    }

    .qty-input {
      background: none; border: none; outline: none;
      color: var(--text); font-size: 0.9rem;
      width: 100%; text-align: center;
      padding: 0 8px; height: 40px;
      font-family: var(--font-body);
    }

    .qty-input::-webkit-inner-spin-button { opacity: 0; }

    /* ═══════════════════════════════════════════════
       EMPTY + LOAD MORE
    ═══════════════════════════════════════════════ */
    .empty-state {
      text-align: center; padding: 5rem 2rem;
      animation: fadeUp 0.5s ease 0.2s both;
    }

    .empty-icon {
      font-size: 3rem; margin-bottom: 1rem;
      opacity: 0.3; display: block;
    }

    .empty-state h3 {
      font-family: var(--font-display);
      font-size: 1.1rem; color: var(--muted); font-weight: 600;
    }

    .load-more-hint {
      font-size: 0.85rem; color: var(--muted); margin-top: 1rem;
    }

    .load-more-link {
      color: var(--accent2); cursor: pointer; text-decoration: underline;
    }

    /* ═══════════════════════════════════════════════
       ADD PRODUCT FORM
    ═══════════════════════════════════════════════ */
    .form-section {
      max-width: 560px;
      animation: fadeUp 0.5s ease 0.1s both;
    }

    .form-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }

    .form-group { margin-bottom: 1.4rem; }

    .form-label {
      display: block;
      font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 11px 14px;
      font-size: 0.9rem; font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,160,0.1);
    }

    .form-control::placeholder { color: var(--muted); opacity: 0.5; }

    textarea.form-control { resize: vertical; min-height: 90px; }

    .form-control-error {
      border-color: var(--warn) !important;
      box-shadow: 0 0 0 3px rgba(255,77,109,0.1) !important;
    }

    .form-error {
      margin-top: 6px; font-size: 0.78rem;
      color: var(--warn);
      display: flex; align-items: center; gap: 5px;
    }

    .form-error::before { content: '⚠'; font-size: 0.7rem; }

    .form-success {
      display: flex; align-items: center; gap: 10px;
      background: rgba(0,229,160,0.08);
      border: 1px solid rgba(0,229,160,0.2);
      color: var(--accent); border-radius: var(--radius-sm);
      padding: 12px 16px; margin-bottom: 1.5rem;
      font-size: 0.85rem; font-weight: 500;
      animation: fadeUp 0.3s ease;
    }

    .price-wrap { position: relative; }

    .price-prefix {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--accent); font-weight: 700; font-size: 0.9rem;
      pointer-events: none; z-index: 1;
    }

    .price-input { padding-left: 28px !important; }

    /* ═══════════════════════════════════════════════
       ANIMATIONS
    ═══════════════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ═══════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════ */
    @media (max-width: 640px) {
      .nexshop-page { padding: 1.5rem 1rem 3rem; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .page-title { font-size: 1.5rem; }
      .product-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script src="/env.js"></script>

</head>
<body>
<app-root></app-root>
</body>
</html>
