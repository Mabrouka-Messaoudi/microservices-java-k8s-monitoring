---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nexshop
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      nodeSelector:
        role: app
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 3; done']
      containers:
        - name: notification-service
          image: YOUR_DOCKERHUB_USERNAME/notification-service:latest  # replaced by deploy.sh
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_KAFKA_BOOTSTRAP-SERVERS
              valueFrom:
                configMapKeyRef:
                  name: nexshop-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL
              valueFrom:
                configMapKeyRef:
                  name: nexshop-config
                  key: SCHEMA_REGISTRY_URL
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: username
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: password
            - name: SPRING_MAIL_HOST
              value: "sandbox.smtp.mailtrap.io"
            - name: SPRING_MAIL_PORT
              value: "2525"
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
              value: "true"
            - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
              value: "true"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: nexshop-config
                  key: ZIPKIN_ENDPOINT
            - name: MANAGEMENT_HEALTH_MAIL_ENABLED
              value: "false"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            - name: MANAGEMENT_OBSERVATIONS_KEY-VALUES_APPLICATION
              value: "notification-service"
            - name: LOKI4J_CLIENT_HTTP_URL
              valueFrom:
                configMapKeyRef:
                  name: nexshop-config
                  key: LOKI_URL
            - name: SERVER_PORT
              value: "8083"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: nexshop
spec:
  selector:
    app: notification-service
  ports:
    - port: 8083
      targetPort: 8083
