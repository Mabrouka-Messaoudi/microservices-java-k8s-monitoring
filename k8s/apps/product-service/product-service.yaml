---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: nexshop
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      nodeSelector:
        role: app
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mongodb 27017; do echo waiting for mongodb; sleep 3; done']
      containers:
        - name: product-service
          image: YOUR_DOCKERHUB_USERNAME/product-service:latest  # replaced by deploy.sh
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: root-password
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@mongodb:27017/product-service?authSource=admin&authMechanism=SCRAM-SHA-256"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: nexshop-config
                  key: ZIPKIN_ENDPOINT
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            - name: MANAGEMENT_OBSERVATIONS_KEY-VALUES_APPLICATION
              value: "product-service"
            - name: LOKI_URL
              valueFrom:
                configMapKeyRef:
                  name: nexshop-config
                  key: LOKI_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: nexshop
spec:
  selector:
    app: product-service
  ports:
    - port: 8080
      targetPort: 8080
